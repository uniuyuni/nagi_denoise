[workspace]
authors = ["Nagi NR"]
channels = ["conda-forge"]
name = "nagi-denoise"
platforms = ["osx-arm64"]
version = "0.2.0"

[dependencies]
python = "3.11.*"
pip = ">=24"

[pypi-dependencies]
torch = ">=2.1"
numpy = ">=1.24"
pillow = ">=10.0"
pyyaml = ">=6.0"
scipy = ">=1.10"
einops = ">=0.7"
timm = ">=0.9"
coremltools = ">=9,<10"
"nagi-denoise" = { path = ".", editable = true }
openexr = ">=3.4.12, <4"
tifffile = ">=2026.3.3, <2027"

[activation.env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"

[tasks]
check-env = "python scripts/check_env.py"
check-mps = "python scripts/check_env.py --require-mps"
test = "python tests/test_model.py && python tests/test_denoise_pipeline.py && python tests/test_losses.py"
train-v2-s = "nagi-train-v2 --config configs/nagi_v2_s.yaml --sidd-root SIDD_Medium_Srgb --output runs/nagi_v2_s --device mps --ckpt-prefix nagi_v2_s --resume-latest"
eval-sidd-v2 = "nagi-eval-sidd --model nagi_v2 --weights runs/nagi_v2_s/nagi_v2_s_final.pt --device auto"
eval-sidd-nafnet = "nagi-eval-sidd --model nafnet --weights benchmarks/nafnet/NAFNet-SIDD-width64.pth --device auto"
eval-sidd-scunet = "nagi-eval-sidd --model scunet --weights benchmarks/scunet/scunet_color_real_psnr.pth --device auto"
denoise = "nagi-denoise"
denoise-exr = "python -m nagi_denoise.pipeline.denoise_exr"
denoise-v2 = "python -m nagi_denoise.pipeline.denoise"
roi-eval = "python -m nagi_denoise.pipeline.roi_noise_eval"
accept-eval = "python -m nagi_denoise.pipeline.acceptance"
train-v2-l = "nagi-train-v2 --config configs/nagi_v2_l.yaml --sidd-root SIDD_Medium_Srgb --output runs/nagi_v2_l --device mps --ckpt-prefix nagi_v2_l --resume-latest"
crop-compare = "python -m nagi_denoise.pipeline.make_crop_compare"
precompute-teacher = "python -m nagi_denoise.pipeline.precompute_teacher --sidd-root SIDD_Medium_Srgb --weights benchmarks/nafnet/NAFNet-SIDD-width64.pth --device mps"
