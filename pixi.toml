[workspace]
authors = ["Nagi NR"]
channels = ["conda-forge"]
name = "nagi-denoise"
platforms = ["osx-arm64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
pip = ">=24"

[pypi-dependencies]
torch = ">=2.1"
numpy = ">=1.24"
pillow = ">=10.0"
pyyaml = ">=6.0"
scipy = ">=1.10"
einops = ">=0.7"
timm = ">=0.9"
gdown = ">=5.0"
"nagi-nr" = { path = "packages/nagi_nr", editable = true }
"nagi-nr-bench" = { path = "packages/nagi_nr_bench", editable = true }
"nafnet-applesilicon" = { path = "packages/nafnet_applesilicon", editable = true }
coremltools = ">=9.0, <10"
openexr = ">=3.4.12, <4"
tifffile = ">=2026.3.3, <2027"

[activation.env]
PYTORCH_ENABLE_MPS_FALLBACK = "1"

[tasks]
check-env = "python scripts/check_env.py"
check-mps = "python scripts/check_env.py --require-mps"
test = "python tests/test_model.py"
bench-nagiq = "python scripts/benchmark_nagiq.py --device mps"
bench-realfast = "python scripts/benchmark_realfast.py --device mps"
bench-gamair = "python scripts/benchmark_gamair.py --device mps"
export-coreml-nafnet = "python scripts/export_coreml_nafnet.py --precision float32 --compute-units all --output runs/nafnet_fast_coreml/nafnet_width64_fp32.mlpackage"
bench-coreml-nafnet = "python scripts/benchmark_coreml_nafnet.py --compute-units cpu_and_gpu --max-patches 128 --profile-loop --progress-every 64 --output-md runs/nafnet_fast_coreml/benchmark_cpu_and_gpu_128_profile.md"
export-coreml-nafnet-full-fp16-b4 = "python scripts/export_coreml_nafnet.py --weights benchmarks/nafnet/NAFNet-SIDD-width64.pth --state-key state_dict --precision float16 --height 256 --width 256 --batch 4 --compute-units all --output runs/nafnet_fast_coreml/nafnet_width64_fp16_b4_256.mlpackage"
export-coreml-nafnet-p3-fp16-b4 = "python scripts/export_coreml_nafnet.py --weights runs/nagiq_nafnet_fast_p3_mse_extend4k/nagiq_nafnet_fast_p3_mse_extend4k_best_infer.pt --state-key state_dict --precision float16 --height 256 --width 256 --batch 4 --compute-units all --output runs/nafnet_fast_coreml/nafnet_fast_p3_extend_best_fp16_b4_256.mlpackage"
export-coreml-nafnet-full-nn = "python scripts/export_coreml_nafnet.py --weights benchmarks/nafnet/NAFNet-SIDD-width64.pth --state-key state_dict --convert-to neuralnetwork --deployment-target macos11 --precision float16 --height 256 --width 256 --batch 1 --compute-units all --output runs/ane_coreml_experiment/nafnet_width64_neuralnetwork_b1_256.mlmodel"
bench-coreml-nafnet-full-safe = "python scripts/benchmark_coreml_nafnet.py --model runs/nafnet_fast_coreml/nafnet_width64_fp16_b4_256.mlpackage --compute-units cpu_and_gpu --height 256 --width 256 --batch 4 --warmup 3 --iters 10 --max-patches 0 --output-md runs/nafnet_fast_coreml/benchmark_full_fp16_b4_256_cpu_and_gpu_random.md"
bench-coreml-nafnet-p3-safe = "python scripts/benchmark_coreml_nafnet.py --model runs/nafnet_fast_coreml/nafnet_fast_p3_extend_best_fp16_b4_256.mlpackage --compute-units cpu_and_gpu --height 256 --width 256 --batch 4 --warmup 3 --iters 10 --max-patches 0 --output-md runs/nafnet_fast_coreml/benchmark_p3_fp16_b4_256_cpu_and_gpu_random.md"
denoise-exr-nafnet-full-safe = "python scripts/denoise_exr_coreml.py --input samples/coreml_exr_input/sample_cat_noisy.EXR --model runs/nafnet_fast_coreml/nafnet_width64_fp16_b4_256.mlpackage --compute-units cpu_and_gpu --tile 256 --batch 4 --overlap 0 --input-space linear --process-scale 1.0 --progress-every 64 --output-dir runs/coreml_exr_outputs_full_fp16_b4_cpu_gpu_native"
denoise-exr-nafnet-p3-safe = "python scripts/denoise_exr_coreml.py --input samples/coreml_exr_input/sample_cat_noisy.EXR --model runs/nafnet_fast_coreml/nafnet_fast_p3_extend_best_fp16_b4_256.mlpackage --compute-units cpu_and_gpu --tile 256 --batch 4 --overlap 0 --input-space linear --process-scale 1.0 --progress-every 64 --output-dir runs/coreml_exr_outputs_p3_fp16_b4_cpu_gpu_native"
denoise-exr-quality = "python scripts/denoise_exr_coreml.py --input samples/coreml_exr_input/sample_cat_noisy.EXR --model runs/nafnet_fast_coreml/nafnet_width64_fp16_b4_256.mlpackage --compute-units cpu_and_gpu --tile 256 --batch 4 --overlap 0 --input-space linear --process-scale 1.0 --progress-every 64 --output-dir runs/coreml_exr_outputs_quality"
denoise-exr-experiment-ane-nn = "python scripts/denoise_exr_coreml.py --input samples/coreml_exr_input/sample_cat_noisy.EXR --model runs/ane_coreml_experiment/nafnet_width64_neuralnetwork_b1_256.mlmodel --compute-units all --tile 256 --batch 1 --overlap 0 --input-space linear --process-scale 1.0 --progress-every 64 --output-dir runs/coreml_exr_outputs_EXPERIMENT_ane_nn_rejected"
search-nafnet-prune = "python scripts/search_nafnet_fast_prune.py --device mps --max-patches 16 --max-steps 4 --output-md runs/nafnet_fast_prune_search/greedy_search.md"
audit-nafnet-fast-c = "python scripts/audit_nafnet_fast_cascade.py --device mps --max-patches 128 --output-dir runs/nafnet_fast_cascade_audit"
audit-nafnet-branch-prune = "python scripts/audit_nafnet_branch_prune.py --device mps --max-patches 8 --output-md runs/nafnet_branch_prune_audit/audit.md"
search-nafnet-branch-prune = "python scripts/search_nafnet_branch_prune.py --device mps --max-patches 8 --max-candidates 16 --max-steps 6 --output-md runs/nafnet_branch_prune_search/greedy.md"
eval-nafnet-branch-prune-p6 = "python scripts/eval_nafnet_branch_prune.py --device mps --max-patches 128 --skip dec0.1.ffn enc3.1.attn enc3.2.attn enc3.3.attn enc3.7.attn middle.2.ffn --output-md runs/nafnet_branch_prune_eval/p6_val128.md"

eval-s = "nagi-eval-sidd --model nagi --weights runs/nagi_nr_s/nagi_nr_s_final.pt --device auto"
eval-m = "nagi-eval-sidd --model nagi --weights runs/nagi_nr_m/nagi_nr_m_final.pt --device auto"
eval-m2 = "nagi-eval-sidd --model nagi --weights runs/nagi_nr_m2/nagi_nr_m2_final.pt --device auto"
eval-m3 = "nagi-eval-sidd --model nagi --weights runs/nagi_nr_m3/nagi_nr_m3_final.pt --device auto"
eval-mluma = "nagi-eval-sidd --model nagi --weights runs/nagi_nr_m_luma_ms/nagi_nr_m_luma_ms_final.pt --device auto"
eval-msrgb = "nagi-eval-sidd --model nagi --weights runs/nagi_nr_m_srgb/nagi_nr_m_srgb_final.pt --device auto"
eval-lc = "nagi-eval-sidd --model nagi --weights runs/nagi_nr_lc/nagi_nr_lc_final.pt --device auto"
eval-l = "nagi-eval-sidd --model nagi --weights runs/nagi_nr_l/nagi_nr_l_final.pt --device auto"
eval-nagiq-q48-sanity = "nagi-eval-sidd --model nagiq --weights runs/nagiq_q48_trim_sanity/nagiq_q48_trim_sanity_final.pt --device auto"
eval-nagiq-q48 = "nagi-eval-sidd --model nagiq --weights runs/nagiq_q48_trim/nagiq_q48_trim_final.pt --device auto"
eval-nafnet = "nagi-eval-sidd --model nafnet --weights benchmarks/nafnet/NAFNet-SIDD-width64.pth --device auto"
eval-scunet = "nagi-eval-sidd --model scunet --weights benchmarks/scunet/scunet_color_real_psnr.pth --device auto"

train-s = "nagi-train --config packages/nagi_nr/configs/nagi_nr_s.yaml --sidd-root SIDD_Medium_Srgb --output runs/nagi_nr_s --device mps --ckpt-prefix nagi_nr_s --resume-latest"
train-m = "nagi-train --config packages/nagi_nr/configs/nagi_nr_m.yaml --sidd-root SIDD_Medium_Srgb --output runs/nagi_nr_m --device mps --ckpt-prefix nagi_nr_m --resume-latest"
