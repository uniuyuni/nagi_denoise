train-lc = "nagi-train --config packages/nagi_nr/configs/nagi_nr_lc.yaml --sidd-root SIDD_Medium_Srgb --output runs/nagi_nr_lc --device mps --ckpt-prefix nagi_nr_lc --resume-latest"
