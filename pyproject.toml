[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nagi-denoise"
version = "1.0.0"
description = "Nagi Denoise: ultra-lightweight HDR-aware blind image denoiser (models + training + inference + benchmark harness)."
readme = "README.md"
requires-python = ">=3.10"
# Source code only. The trained weights are CC BY-NC 4.0 -- see MODEL_LICENSE.
# Kept in the table form `{ text = ... }` rather than PEP 639's bare string:
# the setuptools in this environment rejects the string form.
license = { text = "Apache-2.0" }
authors = [{ name = "Nagi Denoise" }]
keywords = ["denoising", "hdr", "image-restoration", "pytorch", "mps"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "einops>=0.7",
    "tifffile>=2024.1",
]

[project.optional-dependencies]
hdr-io = ["opencv-python>=4.8"]
# Core ML fast path (Apple Silicon). Imported lazily -- nagi_denoise works
# without it, you just cannot use backend="coreml".
coreml = ["coremltools>=9,<10"]
# Fetching the weights from the Hugging Face Hub. Imported lazily and only
# when the asset is missing locally -- see nagi_denoise/assets.py. Everything
# except that last-resort download works without it.
hub = ["huggingface_hub>=0.23"]

[project.scripts]
# The production CLI (two-stage pipeline, HDR-safe, EXR/TIFF).
nagi-denoise-pipeline = "nagi_denoise.pipeline.denoise:main"
# Model-only single-image CLI (no chroma pass, no highlight guard). Legacy.
nagi-denoise = "nagi_denoise.cli:main"
nagi-eval-sidd = "nagi_denoise.bench.eval_sidd_val:main"
nagi-train-v2 = "nagi_denoise.train.train_v2:main"
# Trainer for the retired NagiNR architecture; kept so old configs still run.
nagi-train = "nagi_denoise.train.train_nr:main"

[tool.setuptools.packages.find]
include = ["nagi_denoise*"]

[tool.setuptools.package-data]
nagi_denoise = ["py.typed"]
