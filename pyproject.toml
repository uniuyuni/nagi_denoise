[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nagi-denoise"
version = "0.2.0"
description = "Nagi Denoise: ultra-lightweight HDR-aware blind image denoiser (models + training + inference + benchmark harness)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nagi Denoise" }]
keywords = ["denoising", "hdr", "image-restoration", "pytorch", "mps"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "einops>=0.7",
    "tifffile>=2024.1",
]

[project.optional-dependencies]
hdr-io = ["opencv-python>=4.8"]

[project.scripts]
nagi-train = "nagi_denoise.train.train_nr:main"
nagi-train-v2 = "nagi_denoise.train.train_v2:main"
nagi-denoise = "nagi_denoise.cli:main"
nagi-eval-sidd = "nagi_denoise.bench.eval_sidd_val:main"

[tool.setuptools.packages.find]
include = ["nagi_denoise*"]

[tool.setuptools.package-data]
nagi_denoise = ["py.typed"]
