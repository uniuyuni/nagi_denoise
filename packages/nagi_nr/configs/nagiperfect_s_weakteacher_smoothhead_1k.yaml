# NagiPerfect-S weak-teacher smooth-head screen.
#
# Purpose:
#   Fine-tuning the frozen denoiser body only nudged real-photo chroma noise.
#   This variant keeps the main denoiser frozen and trains only small learned
#   luma/chroma smoothing gates. The smoothing operation is bounded and flat-
#   gated, while weak-teacher HF losses decide where the gates should open.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0
  chroma_gate_threshold: 0.030
  chroma_gate_transition: 0.014
  chroma_gate_kernel_size: 9
  chroma_gate_highlight_threshold: 1.0
  chroma_gate_highlight_transition: 0.2
  chroma_gate_strength: 1.0
  chroma_smooth_branch: true
  chroma_smooth_strength: 0.85
  chroma_smooth_kernel_size: 9
  chroma_smooth_gate_bias: -2.4
  chroma_smooth_gate_scale: 1.0
  luma_smooth_branch: true
  luma_smooth_strength: 0.55
  luma_smooth_kernel_size: 5
  luma_smooth_gate_bias: -2.8
  luma_smooth_gate_scale: 1.0

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 4
  exposure_jitter: [0.85, 1.25]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.04
  gauss_sigma_max: 16.0
  poisson_lambda_range: [35.0, 180.0]
  jpeg_q_range: [94, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

weak_teacher:
  enabled: true
  pairs:
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Cat noisy.EXR
      teacher: runs/perfect_nr/chroma_speckle/xt5_cat/xt5_cat_shadow_soft_chroma_speckle_xstrong.exr
  patch_size: 128
  patches_per_image: 320
  batch_size: 1
  exposure_jitter: [0.90, 1.12]
  flip_rot: true
  randomize_each_access: true
  num_workers: 0
  min_mask_mean: 0.08
  detail_threshold: 0.018
  detail_transition: 0.009
  edge_threshold: 0.032
  edge_transition: 0.014
  highlight_threshold: 1.0
  highlight_transition: 0.25
  delta_threshold: 0.0010
  delta_transition: 0.007
  weight: 8.0
  luma_weight: 0.20
  chroma_weight: 0.35
  luma_hf_weight: 1.60
  chroma_hf_weight: 3.20
  hf_kernel_size: 9

train:
  batch_size: 1
  grad_accum_steps: 3
  total_iters: 1000
  warmup_iters: 80
  lr: 8.0e-4
  lr_min: 4.0e-5
  weight_decay: 0.0
  grad_clip: 0.5
  ema_decay: 0.999
  log_every: 25
  save_every: 500
  keep_last_ckpts: 4
  init_checkpoint: runs/nagiperfect_perfect_s_weakteacher_hf_800/nagiperfect_perfect_s_weakteacher_hf_800_final.pt
  init_state: state_dict
  init_strict: false
  freeze_for_chroma_branch: true

loss:
  final_weight: 0.025
  base_weight: 0.0
  srgb_weight: 0.025
  srgb_base_weight: 0.0
  body_srgb_weight: 0.012
  body_srgb_base_weight: 0.0
  flat_srgb_hf_weight: 0.0
  flat_luma_hf_weight: 0.010
  flat_luma_tail_weight: 0.030
  flat_luma_tail_fraction: 0.018
  flat_chroma_hf_weight: 0.0
  flat_threshold: 0.012
  flat_transition: 0.004
  flat_kernel_size: 9
  edge_luma_hf_weight: 0.020
  edge_threshold: 0.038
  edge_transition: 0.014
  linear_weight: 0.001
  highlight_luma_weight: 0.08
  highlight_chroma_weight: 0.05
  highlight_ratio_weight: 0.03
  detail_weight: 0.020
  confidence_l1_weight: 0.0
  chroma_smooth_gate_l1_weight: 0.002
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
