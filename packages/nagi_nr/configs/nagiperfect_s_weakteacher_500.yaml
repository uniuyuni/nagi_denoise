# NagiPerfect-S weak-teacher real-photo screen.
#
# Purpose:
#   Use the current practical real-photo output as a weak teacher, but only in
#   trusted flat/non-edge/non-highlight regions. This is a short screen to test
#   whether the AI model can absorb the useful luma/chroma cleanup direction
#   without learning the teacher's remaining artifacts everywhere.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0

data:
  patch_size: 128
  patches_per_image: 12
  chunk_size: 4
  exposure_jitter: [0.75, 1.6]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.10
  gauss_sigma_max: 22.0
  poisson_lambda_range: [25.0, 160.0]
  jpeg_q_range: [92, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

weak_teacher:
  enabled: true
  pairs:
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Cat noisy.EXR
      teacher: runs/perfect_nr/chroma_speckle/xt5_cat/xt5_cat_shadow_soft_chroma_speckle_xstrong.exr
  patch_size: 128
  patches_per_image: 96
  batch_size: 1
  exposure_jitter: [0.85, 1.25]
  flip_rot: true
  randomize_each_access: true
  num_workers: 0
  min_mask_mean: 0.04
  detail_threshold: 0.016
  detail_transition: 0.008
  edge_threshold: 0.026
  edge_transition: 0.012
  highlight_threshold: 1.0
  highlight_transition: 0.25
  delta_threshold: 0.0015
  delta_transition: 0.008
  weight: 0.30
  luma_weight: 0.55
  chroma_weight: 0.75

train:
  batch_size: 1
  grad_accum_steps: 3
  total_iters: 500
  warmup_iters: 60
  lr: 5.0e-7
  lr_min: 1.0e-7
  weight_decay: 1.0e-4
  grad_clip: 0.45
  ema_decay: 0.999
  log_every: 25
  save_every: 250
  keep_last_ckpts: 4
  init_checkpoint: runs/nagiperfect_perfect_s_strictflat_5k/nagiperfect_perfect_s_strictflat_5k_final.pt
  init_state: state_dict

loss:
  final_weight: 0.44
  base_weight: 0.13
  srgb_weight: 0.52
  srgb_base_weight: 0.12
  body_srgb_weight: 0.22
  body_srgb_base_weight: 0.04
  flat_srgb_hf_weight: 0.22
  flat_luma_hf_weight: 0.08
  flat_luma_tail_weight: 0.26
  flat_luma_tail_fraction: 0.018
  flat_chroma_hf_weight: 0.10
  flat_threshold: 0.012
  flat_transition: 0.004
  flat_kernel_size: 9
  edge_luma_hf_weight: 0.13
  edge_threshold: 0.038
  edge_transition: 0.014
  linear_weight: 0.025
  highlight_luma_weight: 0.14
  highlight_chroma_weight: 0.07
  highlight_ratio_weight: 0.06
  detail_weight: 0.13
  confidence_l1_weight: 0.0004
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
