# NagiQ q48-trim corrected-recipe screening run.
#
# Purpose:
#   Test whether the corrected q40/q48-fast recipe scales to the q48-trim
#   40 dB candidate. Evaluate checkpoints with live and EMA; do not judge this
#   run by EMA alone before it has stabilized.

model:
  preset: q48-trim

data:
  patch_size: 256
  patches_per_image: 4
  chunk_size: 4
  exposure_jitter: null
  flip_rot: true
  randomize_each_access: true
  num_workers: 1
  prefetch_factor: 1
  return_teacher: true
  output_space: srgb

train:
  batch_size: 1
  grad_accum_steps: 4
  total_iters: 20000
  warmup_iters: 1000
  lr: 2.0e-4
  lr_min: 2.0e-5
  weight_decay: 1.0e-3
  grad_clip: 1.0
  ema_decay: 0.995
  log_every: 100
  save_every: 2000
  keep_last_ckpts: 5

loss:
  charbonnier_eps: 1.0e-3
  teacher_weight_start: 0.90
  teacher_weight_end: 0.55
  grad_weight: 0.02
  clamp_pred: false
