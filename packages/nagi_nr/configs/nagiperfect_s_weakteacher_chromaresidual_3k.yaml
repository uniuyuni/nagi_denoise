# NagiPerfect-S chroma residual branch refinement.
#
# Purpose:
#   The chroma-axis smoothing run improved p99/visible chroma but saturated
#   almost immediately, and wider smoothing worsened chroma metrics. This stage
#   adds the existing local chroma residual branch and trains only that branch.
#   The branch can subtract sparse rg/by speckles without broadening the
#   smoother or further touching luma detail.
#
# Target eval on X-T5 Cat noisy:
#   chroma p99 < 0.34 first, then < 0.30; chroma visible < 0.28 first,
#   edge HF >= 0.795.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0
  chroma_branch: true
  chroma_branch_scale: 0.08
  chroma_branch_width: 16
  chroma_branch_blocks: 1
  chroma_branch_use_input: true
  chroma_gate_threshold: 0.024
  chroma_gate_transition: 0.010
  chroma_gate_kernel_size: 9
  chroma_gate_highlight_threshold: 1.0
  chroma_gate_highlight_transition: 0.2
  chroma_gate_strength: 1.0
  chroma_smooth_branch: true
  chroma_smooth_strength: 1.0
  chroma_smooth_kernel_size: 9
  chroma_smooth_gate_bias: -2.4
  chroma_smooth_gate_scale: 1.0
  luma_smooth_branch: true
  luma_smooth_strength: 0.50
  luma_smooth_kernel_size: 5
  luma_smooth_gate_bias: -2.8
  luma_smooth_gate_scale: 1.0

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 4
  exposure_jitter: [0.92, 1.12]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.04
  gauss_sigma_max: 14.0
  poisson_lambda_range: [45.0, 200.0]
  jpeg_q_range: [95, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

weak_teacher:
  enabled: true
  pairs:
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Cat noisy.EXR
      teacher: runs/perfect_nr/guard_pipeline/xt5_cat_residual_quality_preset/xt5_cat_residual_quality_preset.exr
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Hydrangea.EXR
      teacher: runs/perfect_nr/guard_pipeline/xt5_hydrangea_residual_51500_safety_sweep/xt5_hydrangea_residual_luma_51500_safety200.exr
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Room.EXR
      teacher: runs/perfect_nr/guard_pipeline/xt5_room_residual_quality_preset/xt5_room_residual_quality_preset.exr
  patch_size: 128
  patches_per_image: 432
  chunk_size: 24
  batch_size: 1
  exposure_jitter: [0.96, 1.06]
  flip_rot: true
  randomize_each_access: true
  num_workers: 0
  min_mask_mean: 0.06
  detail_threshold: 0.014
  detail_transition: 0.006
  edge_threshold: 0.021
  edge_transition: 0.008
  highlight_threshold: 1.0
  highlight_transition: 0.25
  delta_threshold: 0.0008
  delta_transition: 0.006
  weight: 9.0
  luma_weight: 0.02
  chroma_weight: 0.08
  luma_hf_weight: 0.20
  luma_hf_tail_weight: 0.25
  luma_hf_tail_fraction: 0.015
  chroma_hf_weight: 0.70
  chroma_hf_tail_weight: 1.80
  chroma_hf_tail_fraction: 0.012
  chroma_axis_hf_weight: 2.40
  chroma_axis_hf_tail_weight: 9.00
  chroma_axis_hf_tail_fraction: 0.008
  hf_kernel_size: 7

train:
  batch_size: 1
  grad_accum_steps: 3
  total_iters: 3000
  warmup_iters: 120
  lr: 1.0e-4
  lr_min: 1.5e-5
  weight_decay: 0.0
  grad_clip: 0.20
  ema_decay: 0.999
  skip_nonfinite: true
  log_every: 25
  save_every: 500
  keep_last_ckpts: 8
  init_checkpoint: runs/nagiperfect_perfect_s_weakteacher_chromaaxis_4k/nagiperfect_perfect_s_weakteacher_chromaaxis_4k_final.pt
  init_state: state_dict
  init_strict: false
  freeze_for_chroma_branch: true
  trainable_prefixes: ["chroma_head."]

loss:
  final_weight: 0.018
  base_weight: 0.0
  srgb_weight: 0.018
  srgb_base_weight: 0.0
  body_srgb_weight: 0.010
  body_srgb_base_weight: 0.0
  flat_srgb_hf_weight: 0.0
  flat_luma_hf_weight: 0.006
  flat_luma_tail_weight: 0.010
  flat_luma_tail_fraction: 0.015
  flat_chroma_hf_weight: 0.0
  flat_threshold: 0.011
  flat_transition: 0.004
  flat_kernel_size: 7
  edge_luma_hf_weight: 0.085
  edge_threshold: 0.034
  edge_transition: 0.014
  linear_weight: 0.001
  highlight_luma_weight: 0.08
  highlight_chroma_weight: 0.06
  highlight_ratio_weight: 0.035
  detail_weight: 0.050
  confidence_l1_weight: 0.0
  chroma_smooth_gate_l1_weight: 0.0015
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
