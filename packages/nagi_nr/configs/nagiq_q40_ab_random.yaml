# NagiQ q40-trim random-crop A/B diagnostic.

model:
  preset: q40-trim

data:
  max_pairs: 64
  patch_size: 256
  patches_per_image: 4
  chunk_size: 4
  exposure_jitter: null
  flip_rot: true
  randomize_each_access: true
  num_workers: 1
  prefetch_factor: 1
  return_teacher: true
  output_space: srgb

train:
  batch_size: 1
  grad_accum_steps: 4
  total_iters: 3000
  warmup_iters: 300
  lr: 2.0e-4
  lr_min: 2.0e-5
  weight_decay: 1.0e-3
  grad_clip: 1.0
  ema_decay: 0.999
  log_every: 100
  save_every: 1000
  keep_last_ckpts: 0

loss:
  charbonnier_eps: 1.0e-3
  teacher_weight_start: 0.90
  teacher_weight_end: 0.70
  grad_weight: 0.02
  clamp_pred: false
