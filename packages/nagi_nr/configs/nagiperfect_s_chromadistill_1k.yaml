# NagiPerfect-S chroma smoother distillation experiment.
#
# Purpose:
#   Direct flat chroma smoothing (`smooth_s050`) reduced real-photo flat chroma
#   HF energy from 0.881 to ~0.657 while preserving edge HF retention. This
#   recipe distills that behavior into a frozen-body chroma branch.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0
  chroma_branch: true
  chroma_branch_scale: 0.28
  chroma_gate_threshold: 0.010
  chroma_gate_transition: 0.006
  chroma_gate_kernel_size: 9
  chroma_gate_highlight_threshold: 1.0
  chroma_gate_highlight_transition: 0.2
  chroma_gate_strength: 1.0
  chroma_branch_width: 16
  chroma_branch_blocks: 2
  chroma_branch_use_input: true

data:
  patch_size: 128
  patches_per_image: 12
  chunk_size: 4
  exposure_jitter: [0.75, 1.8]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.08
  gauss_sigma_max: 18.0
  poisson_lambda_range: [35.0, 180.0]
  jpeg_q_range: [90, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

train:
  batch_size: 1
  grad_accum_steps: 3
  total_iters: 1000
  warmup_iters: 60
  lr: 1.2e-4
  lr_min: 1.5e-5
  weight_decay: 0.0
  grad_clip: 0.5
  ema_decay: 0.999
  log_every: 50
  save_every: 500
  keep_last_ckpts: 3
  init_checkpoint: runs/nagiperfect_perfect_s_bodypush_4k/nagiperfect_perfect_s_bodypush_4k_0002000.pt
  init_state: state_dict
  init_strict: false
  freeze_for_chroma_branch: true

loss:
  final_weight: 0.25
  base_weight: 0.0
  srgb_weight: 0.30
  srgb_base_weight: 0.0
  body_srgb_weight: 0.08
  body_srgb_base_weight: 0.0
  flat_srgb_hf_weight: 0.0
  flat_luma_hf_weight: 0.01
  flat_chroma_hf_weight: 0.0
  flat_chroma_damp_weight: 0.0
  flat_chroma_distill_weight: 2.0
  flat_chroma_distill_strength: 0.50
  flat_chroma_distill_kernel_size: 9
  flat_threshold: 0.010
  flat_transition: 0.006
  flat_kernel_size: 9
  linear_weight: 0.005
  highlight_luma_weight: 0.18
  highlight_chroma_weight: 0.12
  highlight_ratio_weight: 0.08
  detail_weight: 0.08
  confidence_l1_weight: 0.0
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
