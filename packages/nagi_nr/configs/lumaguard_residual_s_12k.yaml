# LumaGuard-Residual-S: learn luma NR allowance from paired noisy/clean residuals.
#
# Goal:
#   Reduce visible luma grain tails without treating true clean-side texture as
#   noise. This is stricter than lumaguard_s_8k because the teacher sees GT.

model:
  width: 16
  blocks: 4
  gate_bias: 0.0

teacher:
  kind: paired_luma
  structure_kernel_size: 9
  detail_kernel_size: 13
  noise_kernel_size: 5
  noise_threshold: 0.006
  noise_transition: 0.005
  clean_detail_threshold: 0.010
  clean_detail_transition: 0.006
  edge_threshold: 0.018
  edge_transition: 0.010
  highlight_threshold: 1.0
  highlight_transition: 0.25

data:
  patch_size: 128
  patches_per_image: 12
  chunk_size: 4
  exposure_jitter: [0.75, 1.0]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.20
  gauss_sigma_max: 34.0
  poisson_lambda_range: [18.0, 140.0]
  jpeg_q_range: [92, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

train:
  batch_size: 4
  total_iters: 12000
  warmup_iters: 80
  lr: 1.2e-3
  lr_min: 4.0e-5
  weight_decay: 0.0
  grad_clip: 1.0
  smooth_weight: 0.025
  log_every: 50
  save_every: 500
