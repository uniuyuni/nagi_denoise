# NagiPerfect-S strong weak-teacher real-photo screen.
#
# Purpose:
#   The first weak-teacher screen proved the path works but the teacher signal
#   was too weak versus normal paired losses. This recipe makes the masked real
#   photo teacher term dominant enough to test whether the model can actually
#   absorb the luma/chroma cleanup behavior.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 4
  exposure_jitter: [0.85, 1.35]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.04
  gauss_sigma_max: 16.0
  poisson_lambda_range: [35.0, 180.0]
  jpeg_q_range: [94, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

weak_teacher:
  enabled: true
  pairs:
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Cat noisy.EXR
      teacher: runs/perfect_nr/chroma_speckle/xt5_cat/xt5_cat_shadow_soft_chroma_speckle_xstrong.exr
  patch_size: 128
  patches_per_image: 160
  batch_size: 1
  exposure_jitter: [0.90, 1.15]
  flip_rot: true
  randomize_each_access: true
  num_workers: 0
  min_mask_mean: 0.06
  detail_threshold: 0.017
  detail_transition: 0.008
  edge_threshold: 0.028
  edge_transition: 0.012
  highlight_threshold: 1.0
  highlight_transition: 0.25
  delta_threshold: 0.0010
  delta_transition: 0.007
  weight: 3.0
  luma_weight: 0.90
  chroma_weight: 1.25

train:
  batch_size: 1
  grad_accum_steps: 3
  total_iters: 500
  warmup_iters: 50
  lr: 1.6e-6
  lr_min: 2.0e-7
  weight_decay: 1.0e-4
  grad_clip: 0.45
  ema_decay: 0.999
  log_every: 25
  save_every: 250
  keep_last_ckpts: 4
  init_checkpoint: runs/nagiperfect_perfect_s_strictflat_5k/nagiperfect_perfect_s_strictflat_5k_final.pt
  init_state: state_dict

loss:
  final_weight: 0.24
  base_weight: 0.06
  srgb_weight: 0.24
  srgb_base_weight: 0.05
  body_srgb_weight: 0.10
  body_srgb_base_weight: 0.02
  flat_srgb_hf_weight: 0.10
  flat_luma_hf_weight: 0.04
  flat_luma_tail_weight: 0.10
  flat_luma_tail_fraction: 0.018
  flat_chroma_hf_weight: 0.04
  flat_threshold: 0.012
  flat_transition: 0.004
  flat_kernel_size: 9
  edge_luma_hf_weight: 0.10
  edge_threshold: 0.038
  edge_transition: 0.014
  linear_weight: 0.012
  highlight_luma_weight: 0.08
  highlight_chroma_weight: 0.04
  highlight_ratio_weight: 0.03
  detail_weight: 0.10
  confidence_l1_weight: 0.0003
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
