# GAMA-IR-L SIDD sRGB MSE/distillation screen.
#
# This is the quality-first GAMA-IR variant from the paper family
# (depth=19, width=80). It is expected to be much heavier to train than S.

model:
  kind: gamair
  preset: gamair-l

data:
  patch_size: 256
  patches_per_image: 4
  chunk_size: 4
  exposure_jitter: null
  flip_rot: true
  randomize_each_access: true
  num_workers: 1
  prefetch_factor: 1
  return_teacher: true
  output_space: srgb

train:
  batch_size: 1
  grad_accum_steps: 4
  total_iters: 2000
  warmup_iters: 300
  lr: 1.0e-4
  lr_min: 2.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.995
  log_every: 50
  save_every: 500
  keep_last_ckpts: 0

validation:
  enabled: true
  every: 500
  max_patches: 128
  noisy_mat: data/ValidationNoisyBlocksSrgb.mat
  gt_mat: data/ValidationGtBlocksSrgb.mat

loss:
  kind: mse_distill
  teacher_weight_start: 0.60
  teacher_weight_end: 0.45
  grad_weight: 0.01
  range_weight: 0.001
  clamp_pred: false
