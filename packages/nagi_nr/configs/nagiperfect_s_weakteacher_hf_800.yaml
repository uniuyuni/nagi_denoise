# NagiPerfect-S weak-teacher high-frequency screen.
#
# Purpose:
#   The first weak-teacher runs barely reduced visible real-photo noise because
#   pixel L1 to the pseudo teacher was too weak for zero-mean grain. This recipe
#   adds direct flat-region luma/chroma HF supervision from the pseudo teacher,
#   while keeping a smaller paired-data anchor to avoid obvious overfit damage.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 4
  exposure_jitter: [0.85, 1.35]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.04
  gauss_sigma_max: 16.0
  poisson_lambda_range: [35.0, 180.0]
  jpeg_q_range: [94, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

weak_teacher:
  enabled: true
  pairs:
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Cat noisy.EXR
      teacher: runs/perfect_nr/chroma_speckle/xt5_cat/xt5_cat_shadow_soft_chroma_speckle_xstrong.exr
  patch_size: 128
  patches_per_image: 256
  batch_size: 1
  exposure_jitter: [0.90, 1.15]
  flip_rot: true
  randomize_each_access: true
  num_workers: 0
  min_mask_mean: 0.08
  detail_threshold: 0.017
  detail_transition: 0.008
  edge_threshold: 0.028
  edge_transition: 0.012
  highlight_threshold: 1.0
  highlight_transition: 0.25
  delta_threshold: 0.0010
  delta_transition: 0.007
  weight: 4.0
  luma_weight: 0.35
  chroma_weight: 0.55
  luma_hf_weight: 1.20
  chroma_hf_weight: 2.40
  hf_kernel_size: 9

train:
  batch_size: 1
  grad_accum_steps: 3
  total_iters: 800
  warmup_iters: 60
  lr: 3.0e-6
  lr_min: 4.0e-7
  weight_decay: 1.0e-4
  grad_clip: 0.40
  ema_decay: 0.999
  log_every: 25
  save_every: 400
  keep_last_ckpts: 4
  init_checkpoint: runs/nagiperfect_perfect_s_strictflat_5k/nagiperfect_perfect_s_strictflat_5k_final.pt
  init_state: state_dict

loss:
  final_weight: 0.18
  base_weight: 0.04
  srgb_weight: 0.18
  srgb_base_weight: 0.04
  body_srgb_weight: 0.08
  body_srgb_base_weight: 0.02
  flat_srgb_hf_weight: 0.08
  flat_luma_hf_weight: 0.03
  flat_luma_tail_weight: 0.08
  flat_luma_tail_fraction: 0.018
  flat_chroma_hf_weight: 0.03
  flat_threshold: 0.012
  flat_transition: 0.004
  flat_kernel_size: 9
  edge_luma_hf_weight: 0.08
  edge_threshold: 0.038
  edge_transition: 0.014
  linear_weight: 0.010
  highlight_luma_weight: 0.07
  highlight_chroma_weight: 0.035
  highlight_ratio_weight: 0.025
  detail_weight: 0.08
  confidence_l1_weight: 0.0003
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
