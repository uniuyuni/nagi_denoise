# NagiPerfect-S strict-flat denoise continuation.
#
# Purpose:
#   Continue from flatpush_final, but stop treating weak texture/thin lines as
#   flat. The aim is not a conservative balance pass; it is stronger denoising
#   in a narrower, more trustworthy flat mask.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0

data:
  patch_size: 128
  patches_per_image: 12
  chunk_size: 4
  exposure_jitter: [0.75, 1.8]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.08
  gauss_sigma_max: 18.0
  poisson_lambda_range: [35.0, 180.0]
  jpeg_q_range: [90, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

train:
  batch_size: 1
  grad_accum_steps: 3
  total_iters: 2000
  warmup_iters: 80
  lr: 8.0e-7
  lr_min: 2.0e-7
  weight_decay: 1.0e-4
  grad_clip: 0.5
  ema_decay: 0.999
  log_every: 50
  save_every: 500
  keep_last_ckpts: 4
  init_checkpoint: runs/nagiperfect_perfect_s_flatpush_2k/nagiperfect_perfect_s_flatpush_2k_final.pt
  init_state: state_dict

loss:
  final_weight: 0.50
  base_weight: 0.16
  srgb_weight: 0.58
  srgb_base_weight: 0.18
  body_srgb_weight: 0.22
  body_srgb_base_weight: 0.06
  flat_srgb_hf_weight: 0.46
  flat_threshold: 0.011
  flat_transition: 0.004
  flat_kernel_size: 9
  edge_luma_hf_weight: 0.08
  edge_threshold: 0.040
  edge_transition: 0.015
  linear_weight: 0.025
  highlight_luma_weight: 0.14
  highlight_chroma_weight: 0.07
  highlight_ratio_weight: 0.06
  detail_weight: 0.12
  confidence_l1_weight: 0.0004
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
