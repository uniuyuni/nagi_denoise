# NagiPerfect-S axis-neutral chroma cleanup branch distillation.
#
# Purpose:
#   The axisneutral_2k run trained only chroma_smooth_head and moved in the
#   wrong direction: that head can only gate a fixed lowpass chroma target.
#   This run adds a tiny RGB chroma cleanup branch and trains only that branch
#   to mimic the axismax post-process. Baseline tether losses keep broad color,
#   luma, and existing denoising close to the chromaaxis_4k model.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0
  chroma_gate_threshold: 0.018
  chroma_gate_transition: 0.014
  chroma_gate_kernel_size: 9
  chroma_gate_highlight_threshold: 1.0
  chroma_gate_highlight_transition: 0.2
  chroma_gate_strength: 1.0
  chroma_smooth_branch: true
  chroma_smooth_strength: 1.0
  chroma_smooth_kernel_size: 9
  chroma_smooth_gate_bias: -2.4
  chroma_smooth_gate_scale: 1.0
  chroma_cleanup_branch: true
  chroma_cleanup_mode: additive_chroma_delta
  chroma_cleanup_strength: 0.16
  chroma_cleanup_kernel_size: 9
  chroma_cleanup_width: 16
  chroma_cleanup_blocks: 1
  luma_smooth_branch: true
  luma_smooth_strength: 0.50
  luma_smooth_kernel_size: 5
  luma_smooth_gate_bias: -2.8
  luma_smooth_gate_scale: 1.0

data:
  patch_size: 128
  patches_per_image: 2
  chunk_size: 2
  exposure_jitter: [1.0, 1.0]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.0
  gauss_sigma_max: 0.0
  poisson_lambda_range: [100.0, 100.0]
  jpeg_q_range: [100, 100]
  max_pairs: 4
  num_workers: 0

weak_teacher:
  enabled: true
  pairs:
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Cat noisy.EXR
      teacher: runs/perfect_nr/nagiperfect_exr/xt5_cat_chromaaxis_iso6400_max/xt5_cat_chromaaxis_iso6400_max_nagiperfect.exr
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Occi noisy.EXR
      teacher: runs/perfect_nr/nagiperfect_exr/xt5_occi_chromaaxis_iso6400_max/xt5_occi_chromaaxis_iso6400_max_nagiperfect.exr
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Room.EXR
      teacher: runs/perfect_nr/nagiperfect_exr/xt5_room_chromaaxis_iso6400_max/xt5_room_chromaaxis_iso6400_max_nagiperfect.exr
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Hydrangea.EXR
      teacher: runs/perfect_nr/nagiperfect_exr/xt5_hydrangea_chromaaxis_iso6400_max/xt5_hydrangea_chromaaxis_iso6400_max_nagiperfect.exr
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/K-5 Dance noisy.EXR
      teacher: runs/perfect_nr/nagiperfect_exr/k5_dance_iso6400_axismax/k5_dance_iso6400_axismax_nagiperfect.exr
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/K-5 Ice noisy.EXR
      teacher: runs/perfect_nr/nagiperfect_exr/k5_ice_iso6400_axismax/k5_ice_iso6400_axismax_nagiperfect.exr
  patch_size: 128
  patches_per_image: 624
  chunk_size: 24
  batch_size: 1
  exposure_jitter: [0.96, 1.04]
  flip_rot: true
  randomize_each_access: true
  num_workers: 0
  min_mask_mean: 0.04
  detail_threshold: 0.024
  detail_transition: 0.012
  edge_threshold: 0.038
  edge_transition: 0.016
  highlight_threshold: 1.0
  highlight_transition: 0.25
  delta_threshold: 0.0004
  delta_transition: 0.004
  weight: 1.25
  luma_weight: 0.0
  chroma_weight: 0.035
  luma_hf_weight: 0.0
  luma_hf_tail_weight: 0.0
  luma_hf_tail_fraction: 0.010
  chroma_hf_weight: 0.50
  chroma_hf_tail_weight: 1.40
  chroma_hf_tail_fraction: 0.012
  chroma_axis_hf_weight: 1.20
  chroma_axis_hf_tail_weight: 3.50
  chroma_axis_hf_tail_fraction: 0.014
  magenta_axis_hf_weight: 0.0
  magenta_axis_hf_tail_weight: 0.0
  magenta_axis_hf_tail_fraction: 0.010
  baseline_luma_weight: 10.0
  baseline_chroma_weight: 2.5
  baseline_chroma_hf_weight: 1.2
  hf_kernel_size: 7

train:
  batch_size: 1
  grad_accum_steps: 2
  total_iters: 1000
  warmup_iters: 50
  lr: 5.0e-5
  lr_min: 8.0e-6
  weight_decay: 0.0
  grad_clip: 0.08
  ema_decay: 0.999
  skip_nonfinite: true
  log_every: 25
  save_every: 250
  keep_last_ckpts: 6
  init_checkpoint: runs/nagiperfect_perfect_s_weakteacher_chromaaxis_4k/nagiperfect_perfect_s_weakteacher_chromaaxis_4k_final.pt
  init_state: state_dict
  init_strict: false
  freeze_for_chroma_branch: true
  trainable_prefixes: ["chroma_cleanup_head."]

loss:
  final_weight: 0.0
  base_weight: 0.0
  srgb_weight: 0.0
  srgb_base_weight: 0.0
  body_srgb_weight: 0.0
  body_srgb_base_weight: 0.0
  flat_srgb_hf_weight: 0.0
  flat_luma_hf_weight: 0.0
  flat_luma_tail_weight: 0.0
  flat_chroma_hf_weight: 0.0
  flat_threshold: 0.011
  flat_transition: 0.004
  flat_kernel_size: 7
  edge_luma_hf_weight: 0.0
  edge_threshold: 0.034
  edge_transition: 0.014
  linear_weight: 0.0
  highlight_luma_weight: 0.0
  highlight_chroma_weight: 0.0
  highlight_ratio_weight: 0.0
  detail_weight: 0.0
  confidence_l1_weight: 0.0
  chroma_smooth_gate_l1_weight: 0.0
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
