# GAMA-IR-S extension from the 2k screen best checkpoint.
#
# This is an additional 8k run, giving a 10k-equivalent local screen.

model:
  kind: gamair
  preset: gamair-s

data:
  patch_size: 256
  patches_per_image: 4
  chunk_size: 4
  exposure_jitter: null
  flip_rot: true
  randomize_each_access: true
  num_workers: 1
  prefetch_factor: 1
  return_teacher: true
  output_space: srgb

train:
  init_checkpoint: runs/nagiq_gamair_s_sidd_mse_2k/nagiq_gamair_s_sidd_mse_2k_best.pt
  init_state: state_dict
  batch_size: 1
  grad_accum_steps: 4
  total_iters: 8000
  warmup_iters: 200
  lr: 8.0e-5
  lr_min: 1.5e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.997
  log_every: 100
  save_every: 0
  keep_last_ckpts: 0

validation:
  enabled: true
  every: 1000
  max_patches: 128
  noisy_mat: data/ValidationNoisyBlocksSrgb.mat
  gt_mat: data/ValidationGtBlocksSrgb.mat

loss:
  kind: mse_distill
  teacher_weight_start: 0.45
  teacher_weight_end: 0.25
  grad_weight: 0.005
  range_weight: 0.001
  clamp_pred: false
