# NagiPerfect-S base-denoise push from the 500-step pilot.
#
# Purpose:
#   Keep the same architecture and test whether stronger/longer supervision
#   increases actual denoising while preserving the X-T5 HDR gate.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  confidence_bias: -2.0

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 4
  exposure_jitter: [0.35, 3.0]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.15
  gauss_sigma_max: 20.0
  poisson_lambda_range: [16.0, 130.0]
  jpeg_q_range: [75, 100]
  num_workers: 0

train:
  batch_size: 1
  grad_accum_steps: 2
  total_iters: 2000
  warmup_iters: 100
  lr: 5.0e-5
  lr_min: 8.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.998
  log_every: 50
  save_every: 500
  keep_last_ckpts: 2
  init_checkpoint: runs/nagiperfect_perfect_s_pilot_500/nagiperfect_perfect_s_pilot_500_final.pt
  init_state: state_dict

loss:
  final_weight: 1.15
  base_weight: 0.55
  linear_weight: 0.10
  highlight_luma_weight: 0.22
  highlight_chroma_weight: 0.08
  detail_weight: 0.12
  confidence_l1_weight: 0.0005
  highlight_threshold: 1.0
  highlight_transition: 0.6
  detail_kernel_size: 9
  linear_clamp: 16.0
  charbonnier_eps: 1.0e-3
