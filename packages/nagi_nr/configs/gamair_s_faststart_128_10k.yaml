# GAMAIR-S fast-start 128px pretrain.
#
# Purpose:
#   Improve sample/update efficiency on this Mac before returning to 256px
#   fine-tuning. This intentionally relaxes the safe identity initialization so
#   gradients reach internal blocks earlier.

model:
  kind: gamair
  preset: gamair-s
  residual_init: 0.01
  ending_init_std: 0.0005

data:
  patch_size: 128
  patches_per_image: 16
  chunk_size: 8
  exposure_jitter: null
  flip_rot: true
  randomize_each_access: true
  num_workers: 1
  prefetch_factor: 1
  return_teacher: true
  output_space: srgb

train:
  batch_size: 1
  grad_accum_steps: 4
  total_iters: 10000
  warmup_iters: 300
  lr: 1.2e-4
  lr_min: 2.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.997
  log_every: 100
  save_every: 0
  keep_last_ckpts: 0

validation:
  enabled: true
  every: 1000
  max_patches: 128
  noisy_mat: data/ValidationNoisyBlocksSrgb.mat
  gt_mat: data/ValidationGtBlocksSrgb.mat

loss:
  kind: mse_distill
  teacher_weight_start: 0.30
  teacher_weight_end: 0.10
  grad_weight: 0.005
  range_weight: 0.002
  clamp_pred: false
