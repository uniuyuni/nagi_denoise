# ChromaGuard-Adaptive-S: learn local mild/strong/xstrong chroma-NR selection.

model:
  width: 16
  blocks: 4
  gate_bias: 0.0

teacher:
  kind: adaptive
  detail_kernel_size: 9
  mild_threshold: 0.014
  strong_threshold: 0.018
  xstrong_threshold: 0.024
  transition: 0.010
  highlight_threshold: 1.0
  highlight_transition: 0.2
  color_edge_threshold: 0.018
  color_edge_transition: 0.010
  chroma_threshold: 0.090
  chroma_transition: 0.050
  xstrong_gain: 1.10
  mild_gain: 0.70

data:
  patch_size: 128
  patches_per_image: 12
  chunk_size: 4
  exposure_jitter: [0.75, 1.0]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.08
  gauss_sigma_max: 18.0
  poisson_lambda_range: [35.0, 180.0]
  jpeg_q_range: [90, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

train:
  batch_size: 4
  total_iters: 1000
  warmup_iters: 50
  lr: 1.5e-3
  lr_min: 5.0e-5
  weight_decay: 0.0
  grad_clip: 1.0
  smooth_weight: 0.02
  log_every: 50
  save_every: 500
