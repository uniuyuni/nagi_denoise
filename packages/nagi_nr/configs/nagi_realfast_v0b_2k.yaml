# Nagi-RealFast v0b Gate-1 screen.
#
# Purpose:
#   Same architecture as v0, but with non-zero residual/head initialization so
#   the backbone learns from the start. This directly tests whether v0's weak
#   2k PSNR was mostly an identity-start recipe problem.

model:
  kind: realfast
  preset: realfast-v0
  residual_init: 0.01
  ending_init_std: 0.0005

data:
  patch_size: 256
  patches_per_image: 8
  chunk_size: 4
  exposure_jitter: null
  flip_rot: true
  randomize_each_access: true
  num_workers: 1
  prefetch_factor: 1
  return_teacher: true
  output_space: srgb

train:
  batch_size: 1
  grad_accum_steps: 2
  total_iters: 2000
  warmup_iters: 300
  lr: 1.5e-4
  lr_min: 1.5e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.99
  log_every: 100
  save_every: 0
  keep_last_ckpts: 0

validation:
  enabled: true
  every: 1000
  max_patches: 128
  noisy_mat: data/ValidationNoisyBlocksSrgb.mat
  gt_mat: data/ValidationGtBlocksSrgb.mat

loss:
  kind: mse_distill
  teacher_weight_start: 0.20
  teacher_weight_end: 0.10
  grad_weight: 0.01
  range_weight: 0.001
  chroma_weight: 0.02
  lowfreq_weight: 0.01
  lowfreq_kernel: 8
  clamp_pred: false
