# NagiPerfect-S flat chroma grain fine-tune.
#
# Purpose:
#   Attack zoom-visible color grain without continuing the RGB-wide flatpush
#   drift. Start from bodypush_2000, use a harder flat mask, reduce global RGB
#   pressure, and apply stronger high-frequency loss to flat chroma residuals
#   than to luma residuals.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0

data:
  patch_size: 128
  patches_per_image: 12
  chunk_size: 4
  exposure_jitter: [0.75, 1.8]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.08
  gauss_sigma_max: 18.0
  poisson_lambda_range: [35.0, 180.0]
  jpeg_q_range: [90, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

train:
  batch_size: 1
  grad_accum_steps: 3
  total_iters: 1000
  warmup_iters: 60
  lr: 1.8e-6
  lr_min: 4.0e-7
  weight_decay: 1.0e-4
  grad_clip: 0.5
  ema_decay: 0.999
  log_every: 50
  save_every: 500
  keep_last_ckpts: 3
  init_checkpoint: runs/nagiperfect_perfect_s_bodypush_4k/nagiperfect_perfect_s_bodypush_4k_0002000.pt
  init_state: state_dict

loss:
  final_weight: 0.56
  base_weight: 0.20
  srgb_weight: 0.60
  srgb_base_weight: 0.22
  body_srgb_weight: 0.26
  body_srgb_base_weight: 0.10
  flat_srgb_hf_weight: 0.0
  flat_luma_hf_weight: 0.10
  flat_chroma_hf_weight: 0.42
  flat_threshold: 0.012
  flat_transition: 0.004
  flat_kernel_size: 9
  linear_weight: 0.03
  highlight_luma_weight: 0.13
  highlight_chroma_weight: 0.065
  highlight_ratio_weight: 0.05
  detail_weight: 0.11
  confidence_l1_weight: 0.0005
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
