# NagiPerfect-S Guard-quality weak-teacher refinement.
#
# Purpose:
#   Distill the current best practical Guard NR result into the bounded
#   NagiPerfect smoothing heads. This keeps the main denoiser body frozen,
#   uses multiple real EXR photos as weak teachers, and pushes flat-region
#   luma/chroma tails without training on highlights or obvious edges.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0
  chroma_gate_threshold: 0.024
  chroma_gate_transition: 0.010
  chroma_gate_kernel_size: 9
  chroma_gate_highlight_threshold: 1.0
  chroma_gate_highlight_transition: 0.2
  chroma_gate_strength: 1.0
  chroma_smooth_branch: true
  chroma_smooth_strength: 1.0
  chroma_smooth_kernel_size: 9
  chroma_smooth_gate_bias: -2.4
  chroma_smooth_gate_scale: 1.0
  luma_smooth_branch: true
  luma_smooth_strength: 0.45
  luma_smooth_kernel_size: 5
  luma_smooth_gate_bias: -2.8
  luma_smooth_gate_scale: 1.0

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 4
  exposure_jitter: [0.90, 1.15]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.04
  gauss_sigma_max: 14.0
  poisson_lambda_range: [45.0, 200.0]
  jpeg_q_range: [95, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

weak_teacher:
  enabled: true
  pairs:
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Cat noisy.EXR
      teacher: runs/perfect_nr/guard_pipeline/xt5_cat_residual_quality_preset/xt5_cat_residual_quality_preset.exr
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Hydrangea.EXR
      teacher: runs/perfect_nr/guard_pipeline/xt5_hydrangea_residual_51500_safety_sweep/xt5_hydrangea_residual_luma_51500_safety200.exr
    - noisy: /Users/uniuyuni/PythonProjects/test_photos/X-T5 Room.EXR
      teacher: runs/perfect_nr/guard_pipeline/xt5_room_residual_quality_preset/xt5_room_residual_quality_preset.exr
  patch_size: 128
  patches_per_image: 360
  chunk_size: 24
  batch_size: 1
  exposure_jitter: [0.94, 1.08]
  flip_rot: true
  randomize_each_access: true
  num_workers: 0
  min_mask_mean: 0.06
  detail_threshold: 0.014
  detail_transition: 0.006
  edge_threshold: 0.022
  edge_transition: 0.008
  highlight_threshold: 1.0
  highlight_transition: 0.25
  delta_threshold: 0.0010
  delta_transition: 0.007
  weight: 6.0
  luma_weight: 0.10
  chroma_weight: 0.22
  luma_hf_weight: 1.40
  chroma_hf_weight: 2.40
  chroma_hf_tail_weight: 3.00
  chroma_hf_tail_fraction: 0.018
  hf_kernel_size: 9

train:
  batch_size: 1
  grad_accum_steps: 3
  total_iters: 3000
  warmup_iters: 120
  lr: 8.0e-5
  lr_min: 2.0e-5
  weight_decay: 0.0
  grad_clip: 0.25
  ema_decay: 0.999
  skip_nonfinite: true
  log_every: 25
  save_every: 500
  keep_last_ckpts: 6
  init_checkpoint: runs/nagiperfect_perfect_s_weakteacher_chromatail_600/nagiperfect_perfect_s_weakteacher_chromatail_600_final.pt
  init_state: state_dict
  init_strict: true
  freeze_for_chroma_branch: true
  trainable_prefixes: ["chroma_smooth_head.", "luma_smooth_head."]

loss:
  final_weight: 0.018
  base_weight: 0.0
  srgb_weight: 0.018
  srgb_base_weight: 0.0
  body_srgb_weight: 0.010
  body_srgb_base_weight: 0.0
  flat_srgb_hf_weight: 0.0
  flat_luma_hf_weight: 0.008
  flat_luma_tail_weight: 0.018
  flat_luma_tail_fraction: 0.018
  flat_chroma_hf_weight: 0.0
  flat_threshold: 0.012
  flat_transition: 0.004
  flat_kernel_size: 9
  edge_luma_hf_weight: 0.060
  edge_threshold: 0.036
  edge_transition: 0.014
  linear_weight: 0.001
  highlight_luma_weight: 0.08
  highlight_chroma_weight: 0.05
  highlight_ratio_weight: 0.03
  detail_weight: 0.040
  confidence_l1_weight: 0.0
  chroma_smooth_gate_l1_weight: 0.002
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
