# Nagi NR-M-luma-ms: low-power 10k probe from the best M checkpoint.
#
# Residual analysis showed that M's remaining error is not mainly high-frequency
# noise; the residual power is concentrated in low/mid-frequency sRGB luma. This
# short fine-tune keeps the original M loss and adds a small multi-scale luma
# term on average-pooled sRGB Y.
#
# This is intentionally not a full-power run: smaller batch, fewer data workers,
# and only 10k steps. It is meant to answer "does directly targeting low-frequency
# luma residuals move validation PSNR?" before committing to longer training.
#
#   pixi run train-mluma

model:
  in_channels: 3
  base_channels: 48
  num_blocks: [4, 4, 8, 4, 4]
  asinh_k: 8.0

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 8
  exposure_jitter: [0.25, 4.0]
  flip_rot: true
  num_workers: 1
  prefetch_factor: 1

train:
  batch_size: 8
  total_iters: 10000
  warmup_iters: 500
  lr: 1.0e-5
  lr_min: 1.0e-6
  weight_decay: 1.0e-3
  grad_clip: 1.0
  ema_decay: 0.999
  log_every: 100
  save_every: 1000
  keep_last_ckpts: 0

loss:
  fft_weight: 0.05
  linear_weight: 0.1
  linear_clamp: 16.0
  charbonnier_eps: 1.0e-3
  luma_ms_weight: 0.5
  luma_ms_scales: [4, 8]
