# Nagi NR-L: Phase 3 quality-first variant.
# Width-scaled (base_channels=64) Lite U-Net, 3.18M params, ~67 ms/256 patch on MPS.
# Trained from scratch with:
#   - NAFNet-width64 knowledge distillation (precomputed teacher targets, 50/50 blend)
#   - Synthetic-degradation augmentation on 50% of batches (GT-only supervision there)
#   - Charbonnier in asinh-compressed space (per-sample, teacher-masked)
#
# Width scaling chosen over FFN-restore / depth after MPS benchmarking:
# C64-Lite (3.18M @ 67ms) strictly dominates C48+FFN (2.98M @ 91ms) and
# C48-deep (3.43M @ 100ms) on the params-per-ms front.
#
# Prereq: run scripts/precompute_teacher.py first to populate *_TEACHER_SRGB_*.PNG.

model:
  in_channels: 3
  base_channels: 64
  num_blocks: [4, 4, 8, 4, 4]
  asinh_k: 8.0
  block_ffn: false                  # Lite blocks (FFN inefficient on MPS)

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 8
  exposure_jitter: [0.25, 4.0]
  flip_rot: true
  num_workers: 4
  prefetch_factor: 4

  return_teacher: true              # load precomputed NAFNet teacher targets
  synth_prob: 0.5                   # 50% synthetic degradations (GT-only there)
  gauss_sigma_max: 30.0
  poisson_lambda_range: [10.0, 100.0]
  jpeg_q_range: [60, 100]

train:
  batch_size: 16
  total_iters: 150000
  warmup_iters: 2000
  lr: 2.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-3
  grad_clip: 1.0
  ema_decay: 0.999
  log_every: 100
  save_every: 2000
  keep_last_ckpts: 5       # rotate: keep only the 5 most recent mid-run checkpoints

loss:
  distill: true                     # use NagiDistillLoss
  gt_weight: 0.5
  distill_weight: 0.5
  charbonnier_eps: 1.0e-3
