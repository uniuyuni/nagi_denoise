# Nagi-RealFast v0 2k -> 3k live extension.
#
# Purpose:
#   Continue from the 2k live weights after the identity-start model finally
#   began moving. This is a short diagnostic only, not production training.

model:
  kind: realfast
  preset: realfast-v0
  residual_init: 0.0
  ending_init_std: 0.0

data:
  patch_size: 256
  patches_per_image: 8
  chunk_size: 4
  exposure_jitter: null
  flip_rot: true
  randomize_each_access: true
  num_workers: 1
  prefetch_factor: 1
  return_teacher: true
  output_space: srgb

train:
  batch_size: 1
  grad_accum_steps: 2
  total_iters: 1000
  warmup_iters: 100
  lr: 5.0e-5
  lr_min: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.99
  log_every: 100
  save_every: 0
  keep_last_ckpts: 0
  init_checkpoint: runs/nagiq_realfast_v0_2k/nagiq_realfast_v0_2k_final.pt
  init_state: model_state_dict

validation:
  enabled: true
  every: 500
  max_patches: 128
  noisy_mat: data/ValidationNoisyBlocksSrgb.mat
  gt_mat: data/ValidationGtBlocksSrgb.mat

loss:
  kind: mse_distill
  teacher_weight_start: 0.10
  teacher_weight_end: 0.08
  grad_weight: 0.01
  range_weight: 0.001
  chroma_weight: 0.02
  lowfreq_weight: 0.01
  lowfreq_kernel: 8
  clamp_pred: false
