# Nagi-RealFast v1 Gate-1 screen.
#
# Purpose:
#   Restore only the final decoder high-resolution FFN capacity that v0 removed,
#   while keeping the speed win. Encoder+decoder high-res FFNs together were
#   too slow on MPS; the decoder-side FFN is the more direct output-refinement
#   candidate.

model:
  kind: realfast
  preset: realfast-v1-dec
  residual_init: 0.0
  ending_init_std: 0.0003

data:
  patch_size: 256
  patches_per_image: 8
  chunk_size: 4
  exposure_jitter: null
  flip_rot: true
  randomize_each_access: true
  num_workers: 1
  prefetch_factor: 1
  return_teacher: true
  output_space: srgb

train:
  batch_size: 1
  grad_accum_steps: 2
  total_iters: 2000
  warmup_iters: 300
  lr: 1.2e-4
  lr_min: 1.2e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.99
  log_every: 100
  save_every: 0
  keep_last_ckpts: 0

validation:
  enabled: true
  every: 1000
  max_patches: 128
  noisy_mat: data/ValidationNoisyBlocksSrgb.mat
  gt_mat: data/ValidationGtBlocksSrgb.mat

loss:
  kind: mse_distill
  teacher_weight_start: 0.15
  teacher_weight_end: 0.10
  grad_weight: 0.005
  range_weight: 0.001
  chroma_weight: 0.005
  lowfreq_weight: 0.003
  lowfreq_kernel: 8
  clamp_pred: false
