# NAFNet-Fast-P3 controlled extension after the 2k MSE screen.
#
# Purpose:
#   Continue from the 2k best checkpoint with lower LR and weaker teacher pull.
#   The goal is to see whether P3 can move from the 39.7 dB val128 range toward
#   40 dB without an open-ended long run.

model:
  width: 64
  enc_blk_nums: [2, 2, 4, 6]
  middle_blk_num: 11
  dec_blk_nums: [2, 2, 2, 2]

data:
  patch_size: 256
  patches_per_image: 4
  chunk_size: 4
  exposure_jitter: null
  flip_rot: true
  randomize_each_access: true
  num_workers: 1
  prefetch_factor: 1
  return_teacher: true
  output_space: srgb

train:
  init_checkpoint: runs/nagiq_nafnet_fast_p3_mse_2k/nagiq_nafnet_fast_p3_mse_2k_best.pt
  init_state: state_dict
  batch_size: 1
  grad_accum_steps: 4
  total_iters: 4000
  warmup_iters: 300
  lr: 2.0e-5
  lr_min: 5.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.997
  log_every: 100
  save_every: 1000
  keep_last_ckpts: 0

validation:
  enabled: true
  every: 1000
  max_patches: 128
  noisy_mat: data/ValidationNoisyBlocksSrgb.mat
  gt_mat: data/ValidationGtBlocksSrgb.mat

loss:
  kind: mse_distill
  teacher_weight_start: 0.35
  teacher_weight_end: 0.25
  grad_weight: 0.005
  range_weight: 0.001
  clamp_pred: false
