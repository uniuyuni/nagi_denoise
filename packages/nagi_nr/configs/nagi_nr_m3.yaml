# Nagi NR-M3: SIDD-only low-LR fine-tune from the current best M checkpoint.
#
# Goal:
#   Improve the known-best M model without changing architecture or introducing
#   synthetic/deployment distribution shifts. This run keeps all mid-run
#   checkpoints so validation-best can be selected after a short screening run.
#
# Start with:
#   pixi run python scripts/launch_training.py m3

model:
  in_channels: 3
  base_channels: 48
  num_blocks: [4, 4, 8, 4, 4]
  asinh_k: 8.0

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 8
  exposure_jitter: [0.25, 4.0]
  flip_rot: true
  num_workers: 4
  prefetch_factor: 4

train:
  batch_size: 16
  total_iters: 30000
  warmup_iters: 500
  lr: 2.0e-5
  lr_min: 1.0e-6
  weight_decay: 1.0e-3
  grad_clip: 1.0
  ema_decay: 0.999
  log_every: 100
  save_every: 2000
  keep_last_ckpts: 0      # keep all; choose validation-best after the run

loss:
  fft_weight: 0.05
  linear_weight: 0.1
  linear_clamp: 16.0
  charbonnier_eps: 1.0e-3
