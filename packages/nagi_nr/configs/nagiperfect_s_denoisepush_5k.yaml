# NagiPerfect-S denoise-push fine-tune.
#
# Purpose:
#   Start from the current HDR-safe hlguard checkpoint, then push ordinary
#   visible denoising harder. HDR preservation is now handled primarily by the
#   input highlight guard at inference time, so this recipe reduces highlight
#   loss pressure and adds sRGB-space reconstruction loss for midtone/shadow
#   noise that is visually obvious in rendered images.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  compressed_output_clamp: 2.0
  confidence_bias: -2.0
  highlight_protect_threshold: 0.0
  highlight_protect_transition: 0.15
  highlight_protect_strength: 0.0

data:
  patch_size: 128
  patches_per_image: 12
  chunk_size: 4
  exposure_jitter: [0.75, 1.8]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.08
  gauss_sigma_max: 18.0
  poisson_lambda_range: [35.0, 180.0]
  jpeg_q_range: [90, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

train:
  batch_size: 1
  grad_accum_steps: 3
  total_iters: 5000
  warmup_iters: 200
  lr: 6.0e-6
  lr_min: 8.0e-7
  weight_decay: 1.0e-4
  grad_clip: 0.5
  ema_decay: 0.999
  log_every: 50
  save_every: 1000
  keep_last_ckpts: 3
  init_checkpoint: runs/nagiperfect_perfect_s_hlguard_1k/nagiperfect_perfect_s_hlguard_1k_final.pt
  init_state: state_dict

loss:
  final_weight: 0.60
  base_weight: 0.20
  srgb_weight: 0.80
  srgb_base_weight: 0.25
  linear_weight: 0.03
  highlight_luma_weight: 0.08
  highlight_chroma_weight: 0.03
  highlight_ratio_weight: 0.02
  detail_weight: 0.06
  confidence_l1_weight: 0.0005
  highlight_threshold: 1.0
  highlight_transition: 0.7
  detail_kernel_size: 9
  linear_clamp: 12.0
  charbonnier_eps: 1.0e-3
