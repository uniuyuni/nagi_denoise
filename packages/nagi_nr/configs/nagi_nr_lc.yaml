# Nagi NR-LC ("L, clean"): the controlled capacity A/B that L never ran.
#
# The original L confounded FOUR changes vs M (width 48->64, 150k iters instead
# of 300k, 50% synthetic degradations, full switch to NAFNet-distillation loss),
# so its underperformance says nothing about capacity. This config changes ONLY
# base_channels (48 -> 64) and holds M's exact recipe otherwise: 300k iters,
# pure SIDD (no synth, no teacher), and M's compressed-space loss. Trained from
# scratch, it is a clean head-to-head answer to "does width help?".
#
#   pixi run train-lc     # then: pixi run eval-lc

model:
  in_channels: 3
  base_channels: 64          # the ONLY change vs nagi_nr_m.yaml
  num_blocks: [4, 4, 8, 4, 4]
  asinh_k: 8.0

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 8
  exposure_jitter: [0.25, 4.0]
  flip_rot: true
  num_workers: 4
  prefetch_factor: 4

train:
  batch_size: 16
  total_iters: 300000
  warmup_iters: 2000
  lr: 2.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-3
  grad_clip: 1.0
  ema_decay: 0.999
  log_every: 100
  save_every: 10000

loss:
  fft_weight: 0.05
  linear_weight: 0.1
  linear_clamp: 16.0
  charbonnier_eps: 1.0e-3
