# NagiPerfect-S first pilot.
#
# Purpose:
#   Verify that the split base/detail/confidence design learns without breaking
#   HDR/linear behavior. This is intentionally short and conservative.

model:
  kind: nagiperfect
  preset: perfect-s
  detail_scale: 0.25
  confidence_bias: -2.0

data:
  patch_size: 128
  patches_per_image: 8
  chunk_size: 4
  exposure_jitter: [0.35, 3.0]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.10
  gauss_sigma_max: 18.0
  poisson_lambda_range: [18.0, 120.0]
  jpeg_q_range: [75, 100]
  num_workers: 0

train:
  batch_size: 1
  grad_accum_steps: 2
  total_iters: 500
  warmup_iters: 50
  lr: 8.0e-5
  lr_min: 1.5e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.997
  log_every: 25
  save_every: 250
  keep_last_ckpts: 2

loss:
  final_weight: 1.0
  base_weight: 0.35
  linear_weight: 0.08
  highlight_luma_weight: 0.22
  highlight_chroma_weight: 0.08
  detail_weight: 0.14
  confidence_l1_weight: 0.002
  highlight_threshold: 1.0
  highlight_transition: 0.6
  detail_kernel_size: 9
  linear_clamp: 16.0
  charbonnier_eps: 1.0e-3
