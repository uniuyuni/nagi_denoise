# GAMAIR-S 128px PolyU mixed fine-tune.
#
# Purpose:
#   Add real-camera noise diversity after the SIDD-only fast-start run. PolyU is
#   used as a conservative auxiliary set; SIDD remains the dominant source and
#   validation still measures SIDD val128 so quality drift is visible.

model:
  kind: gamair
  preset: gamair-s
  residual_init: 0.01
  ending_init_std: 0.0005

data:
  patch_size: 128
  patches_per_image: 16
  chunk_size: 8
  exposure_jitter: null
  flip_rot: true
  randomize_each_access: true
  num_workers: 1
  prefetch_factor: 1
  return_teacher: true
  output_space: srgb
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

train:
  batch_size: 1
  grad_accum_steps: 4
  total_iters: 5000
  warmup_iters: 200
  lr: 5.0e-5
  lr_min: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.997
  log_every: 100
  save_every: 0
  keep_last_ckpts: 0
  init_checkpoint: runs/nagiq_gamair_s_faststart_128_10k/nagiq_gamair_s_faststart_128_10k_best.pt
  init_state: state_dict

validation:
  enabled: true
  every: 1000
  max_patches: 128
  noisy_mat: data/ValidationNoisyBlocksSrgb.mat
  gt_mat: data/ValidationGtBlocksSrgb.mat

loss:
  kind: mse_distill
  teacher_weight_start: 0.15
  teacher_weight_end: 0.05
  grad_weight: 0.005
  range_weight: 0.002
  clamp_pred: false
