# LumaGuard-S: learn where guided luma NR is allowed to act.

model:
  width: 16
  blocks: 4
  gate_bias: 0.0

teacher:
  kind: luma
  structure_kernel_size: 9
  detail_kernel_size: 19
  detail_threshold: 0.010
  detail_transition: 0.006
  edge_threshold: 0.018
  edge_transition: 0.010
  highlight_threshold: 1.0
  highlight_transition: 0.25

data:
  patch_size: 128
  patches_per_image: 12
  chunk_size: 4
  exposure_jitter: [0.75, 1.0]
  flip_rot: true
  randomize_each_access: true
  synth_prob: 0.12
  gauss_sigma_max: 22.0
  poisson_lambda_range: [25.0, 160.0]
  jpeg_q_range: [90, 100]
  num_workers: 0
  polyu_root: PolyU-Real-World-Noisy-Images-Dataset-master
  polyu_split: CroppedImages

train:
  batch_size: 4
  total_iters: 8000
  warmup_iters: 50
  lr: 1.5e-3
  lr_min: 5.0e-5
  weight_decay: 0.0
  grad_clip: 1.0
  smooth_weight: 0.03
  log_every: 50
  save_every: 500
