[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nagi-nr"
version = "0.1.0"
description = "Nagi NR: ultra-lightweight HDR-aware blind image denoiser (model + training + inference)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nagi NR" }]
keywords = ["denoising", "hdr", "image-restoration", "pytorch", "mps"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
hdr-io = ["opencv-python>=4.8"]

[project.scripts]
nagi-train = "nagi_nr.train:main"
nagi-denoise = "nagi_nr._cli_denoise:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nagi_nr = ["py.typed"]
